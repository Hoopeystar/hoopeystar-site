<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTZED Game Night</title>
    <meta name="description" content="Bodycam & true crime trivia game for member game nights." />
    <style>
      .answer-overlay-timer .ov-timer-num {
        display: none;
      }

      .answer-overlay-timer .ov-timer-bar {
        background: #FFD600;
        box-shadow: 0 0 12px rgba(255, 214, 0, 0.45);
        transition: none !important;
        will-change: width;
      }

      .answer-overlay-timer.is-advancing .ov-timer-bar {
        width: 100% !important;
        animation: answer-timer-pulse 0.8s ease-in-out infinite alternate;
      }

      /* Make the seconds tick labels beneath settings sliders easier to read. */
      .settings-slider + div {
        height: 22px !important;
        font-size: 14px !important;
        line-height: 1.25;
      }

      /* KTZED logo word in Rubik Glitch (OFL, self-hosted; see assets/OFL.txt). */
      @font-face {
        font-family: 'Rubik Glitch';
        src: url('/ktzedgamenight/assets/RubikGlitch-Regular.woff2') format('woff2');
        font-display: swap;
      }

      .logo-cam .ktzed-word {
        display: inline-block;
        font-family: 'Rubik Glitch', 'Bebas Neue', sans-serif;
        font-weight: 400;
        letter-spacing: 0;
        color: #7DC3CA;
        -webkit-text-stroke: 0.15em #F9DA5A;
        paint-order: stroke fill;
        font-size: 1.12em;
        text-shadow: none;
        filter: drop-shadow(0 0.04em 0.08em rgba(0, 0, 0, 0.75));
        margin-bottom: 0.08em;
      }

      @keyframes answer-timer-pulse {
        from { opacity: 0.25; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .answer-overlay-timer .ov-timer-bar {
          width: 100%;
          animation: none;
          background: #FFD600;
        }
      }
    </style>
    <script src="/ktzedgamenight/questions.js"></script>
    <script type="module">
      // ?overlay=1 loads the new 1920x1080 stage overlay; everything else keeps the existing app bundle.
      const isOverlay = new URLSearchParams(location.search).get('overlay') === '1';
      import(isOverlay ? '/ktzedgamenight/assets/overlay-B49wsP0a.js' : '/ktzedgamenight/assets/index-DaVPoJaa.js');
    </script>
    <script>
      // Wrap the "KTZED" text of the home logo in a span so only that word gets the Rubik Glitch styling.
      // The existing text node is moved, not replaced, so React keeps its reference.
      (function () {
        function wrapLogo() {
          document.querySelectorAll('.logo-cam').forEach(function (el) {
            if (el.querySelector('.ktzed-word')) return;
            for (var i = 0; i < el.childNodes.length; i++) {
              var n = el.childNodes[i];
              if (n.nodeType === 3 && n.nodeValue.trim() === 'KTZED') {
                var span = document.createElement('span');
                span.className = 'ktzed-word';
                el.insertBefore(span, n);
                span.appendChild(n);
                return;
              }
            }
          });
        }
        new MutationObserver(wrapLogo).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', wrapLogo);
      })();
    </script>
    <script defer src="/ktzedgamenight/answer-progress.js"></script>
    <script defer src="/ktzedgamenight/overlay-score-delay.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
